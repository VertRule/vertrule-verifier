# Numeric safety policy scope for vertrule-verifier
# Layer 4: Verification — no float arithmetic, only finiteness validation

[scope]
# All source files are governed
strict = ["src/**/*.rs"]

# Exemptions: f32::from_bits used solely for IEEE-754 finiteness checks
# in mri_profile.rs (no arithmetic, no transcendentals, no comparisons
# beyond is_finite and range containment on finite values).
# Clippy float_arithmetic = "deny" enforces at compile time.
[allowlist]
finiteness_checks = ["src/mri_profile.rs"]
